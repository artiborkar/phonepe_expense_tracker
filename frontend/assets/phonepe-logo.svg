<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Circular PhonePe Purple Background -->
  <circle cx="250" cy="250" r="250" fill="#5F259F" />
  
  <!-- Exact White Devanagari 'पे' Character -->
  <g fill="#FFFFFF">
    <!-- Top Diagonal Accent (Slant Matra) -->
    <path d="M 210 65 L 245 65 L 305 165 L 270 165 Z" />
    
    <!-- Top Horizontal Shirorekha Bar -->
    <rect x="145" y="165" width="220" height="34" rx="17" />
    
    <!-- Right Vertical Spine Stem -->
    <rect x="290" y="165" width="36" height="250" rx="18" />
    
    <!-- Left Loop 'प' with Smooth Inner and Outer Curves -->
    <path d="M 180 195 L 180 295 C 180 345, 215 350, 290 350 L 290 315 C 235 315, 215 315, 215 285 L 215 195 Z" />
  </g>
</svg>
